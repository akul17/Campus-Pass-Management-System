<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transport Pass Management System - Login</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        h2::before {
            content: none;
            display: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>Transport Pass Management System</h1>
    </header>

    <main>
        <h2 style="text-align: center;">Login</h2>

        <form id="login" onsubmit="handleLogin(event)">
            <div>
                <label for="user-role">Select Role:</label>
                <select id="user-role" name="role">
                    <option value="user">Pass Holder / Commuter</option>
                    <option value="admin">Administrator</option>
                </select>
            </div>
            <br>

            <div>
                <label for="username">Username / Email:</label>
                <input type="text" id="username" name="username">
            </div>
            <br>

            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password">
            </div>
            <br>

            <div>
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Remember me</label>
            </div>
            <br>

            <div>
                <button type="submit">Login</button>
                <button type="reset">Clear</button>
            </div>
            <br>

            <div>
                <a href="#">Forgot Password?</a>
            </div>
            <div>
                <p>Don't have an account? <a href="#">Register here</a></p>
            </div>
        </form>
    </main>



    <script>
        function handleLogin(event) {
            event.preventDefault();
            const selectedRole = document.getElementById("user-role").value;

            if (selectedRole === "admin") {
                window.location.href = "admin-dashboard.html";
            } else {
                window.location.href = "dashboard.html";
            }
        }
    </script>
</body>

</html>
